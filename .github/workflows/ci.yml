name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: "Build & Vet"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
